[project]
name = "poolprobe"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eth-utils==6.0.0",
    "titanoboa==0.2.8",
    "vyper==0.4.3",
    "web3==7.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["proxy"]

[tool.ruff.format]
quote-style = "single"
